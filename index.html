<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang web của TON</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    button,
    input {
      font: inherit;
    }

    .home-page {
      min-height: 100vh;
      border: 3px solid #7048ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 48px;
    }

    h1 {
      margin: 0 16px 48px;
      font-size: 20px;
      line-height: 1.4;
      text-align: center;
      font-weight: 700;
    }

    .flashcard-button {
      min-width: 148px;
      height: 34px;
      border: 2px solid #666;
      background: #fff;
      color: #111;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .flashcard-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 15px;
      background: #fff;
    }

    .home-nav-button {
      width: 150px;
      height: 58px;
      border: 3px solid #111;
      background: #fff;
      color: #ff3333;
      font-size: 20px;
      cursor: pointer;
      margin-bottom: 28px;
    }

    .flashcard-frame {
      width: min(430px, calc(100vw - 30px));
      min-height: 520px;
      border: 3px solid #111;
      padding: 4px;
      background: #fff;
    }

    .flashcard-toolbar {
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      height: 40px;
    }

    .screen-title {
      grid-column: 2;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      position: relative;
      cursor: pointer;
      padding: 0;
    }

    .back-icon::before,
    .back-icon::after {
      content: "";
      position: absolute;
      left: 8px;
      width: 26px;
      height: 6px;
      background: #111;
      border-radius: 4px;
      transform-origin: left center;
    }

    .back-icon::before {
      top: 17px;
      transform: rotate(-45deg);
    }

    .back-icon::after {
      top: 17px;
      transform: rotate(45deg);
    }

    .settings-icon {
      grid-column: 3;
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
    }

    .deck-toolbar {
      display: grid;
      grid-template-columns: 44px 1fr 70px 44px;
      gap: 8px;
      align-items: center;
      height: 48px;
    }

    .deck-toolbar .screen-title {
      grid-column: 2;
    }

    .deck-toolbar .settings-icon {
      grid-column: 4;
    }

    .deck-list,
    .settings-list {
      display: grid;
      gap: 8px;
    }

    .deck-row,
    .add-card-button,
    .settings-action {
      width: 100%;
      height: 42px;
      border: 3px solid #111;
      background: #fff;
      color: #111;
    }

    .deck-row {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      font-size: 18px;
      position: relative;
    }

    .deck-open {
      grid-column: 1 / 3;
      height: 100%;
      border: 0;
      background: transparent;
      color: #111;
      cursor: pointer;
      padding-left: 42px;
      text-align: center;
    }

    .deck-menu {
      grid-column: 3;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      color: #111;
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      padding: 0 0 8px;
    }

    .add-card-button {
      font-size: 42px;
      line-height: 24px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 7px;
    }

    .name-form {
      display: grid;
      grid-template-columns: 70px 1fr 50px;
      gap: 4px;
      align-items: center;
    }

    .name-input,
    .name-action {
      height: 34px;
      border: 3px solid #111;
      background: #fff;
      color: #111;
      font-size: 13px;
    }

    .name-input {
      min-width: 0;
      padding: 0 6px;
      text-align: center;
    }

    .name-action {
      padding: 0;
      cursor: pointer;
      font-weight: 700;
    }

    .settings-list {
      margin-top: 8px;
    }

    .settings-action {
      cursor: pointer;
      font-size: 16px;
    }

    .word-form {
      display: grid;
      grid-template-columns: 62px 1fr;
      column-gap: 8px;
      row-gap: 16px;
      align-items: center;
      margin: 8px 10px 0;
    }

    .word-label {
      font-size: 14px;
      white-space: nowrap;
    }

    .word-input {
      width: 100%;
      height: 30px;
      border: 3px solid #111;
      padding: 0 6px;
      background: #fff;
      color: #111;
      font-size: 14px;
    }

    .word-submit {
      grid-column: 1 / -1;
      justify-self: center;
      width: 50px;
      height: 31px;
      border: 3px solid #111;
      background: #fff;
      color: #111;
      font-size: 14px;
      cursor: pointer;
    }

    .deck-word-list {
      display: grid;
      gap: 18px;
      margin: 18px 18px 0;
    }

    .deck-word-item {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 14px;
      align-items: center;
      position: relative;
    }

    .word-number {
      text-align: center;
      font-size: 18px;
    }

    .kanji-box {
      min-height: 42px;
      border: 3px solid #111;
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      padding: 0 8px;
      background: #fff;
      color: #111;
      font-size: 18px;
      font-weight: 700;
    }

    .kanji-text {
      grid-column: 2;
      text-align: center;
    }

    .word-menu {
      grid-column: 3;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      color: #111;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      padding: 0 0 8px;
    }

    .word-action-menu {
      position: absolute;
      right: 0;
      top: 46px;
      z-index: 2;
      display: grid;
      gap: 4px;
      width: 120px;
      border: 3px solid #111;
      background: #fff;
      padding: 4px;
    }

    .word-action-button {
      height: 30px;
      border: 2px solid #111;
      background: #fff;
      color: #111;
      cursor: pointer;
      font-size: 14px;
    }

    .study-start {
      grid-column: 3;
      width: 70px;
      height: 42px;
      border: 3px solid #111;
      background: #fff;
      color: #111;
      font-size: 18px;
      cursor: pointer;
    }

    .study-card {
      min-height: 295px;
      border: 3px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 18px 10px 18px;
      background: #fff;
      color: #111;
      text-align: center;
      padding: 12px;
      cursor: pointer;
      position: relative;
    }

    .memory-dot {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 18px;
      height: 18px;
      border: 3px solid #111;
      border-radius: 50%;
      background: #111;
    }

    .memory-dot.remembered {
      background: #0fb34d;
      border-color: #0fb34d;
    }

    .memory-dot.forgotten {
      background: #ff3333;
      border-color: #ff3333;
    }

    .study-card-number {
      position: absolute;
      top: 4px;
      right: 8px;
      color: #ff3333;
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
    }

    .study-card-content {
      display: grid;
      gap: 10px;
      font-size: 42px;
      line-height: 1.25;
    }

    .study-card-content.multi {
      font-size: 24px;
    }

    .study-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin: 0 10px 24px;
    }

    .study-action {
      height: 42px;
      border: 3px solid #111;
      background: #fff;
      color: #111;
      font-size: 20px;
      cursor: pointer;
    }

    .study-action.active,
    .study-action.remembered-active {
      background: #7bd88f;
    }

    .study-action.forgotten-active {
      background: #ff8a8a;
    }

    .study-nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 28px;
      margin: 0 28px;
    }

    .study-nav-button,
    .study-add-button {
      height: 42px;
      border: 3px solid #111;
      background: #fff;
      color: #111;
      cursor: pointer;
    }

    .study-nav-button {
      font-size: 46px;
      line-height: 32px;
      font-weight: 700;
      padding: 0 0 8px;
    }

    .study-add-button {
      font-size: 20px;
    }

    .group-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .group-button,
    .create-group-button,
    .group-name-input,
    .group-form-button {
      height: 38px;
      border: 3px solid #111;
      background: #fff;
      color: #111;
      font-size: 16px;
    }

    .group-button,
    .create-group-button,
    .group-form-button {
      cursor: pointer;
    }

    .group-form {
      display: grid;
      grid-template-columns: 1fr 56px 56px;
      gap: 5px;
    }

    .group-name-input {
      min-width: 0;
      padding: 0 8px;
    }

    .study-options {
      display: grid;
      gap: 10px;
      margin: 0 22px 0 58px;
    }

    .option-section-title {
      width: 96px;
      height: 34px;
      border: 3px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      font-size: 14px;
    }

    .option-row {
      display: grid;
      grid-template-columns: 1fr 34px 34px;
      gap: 14px;
      align-items: center;
      font-size: 13px;
    }

    .option-row input[type="checkbox"] {
      width: 28px;
      height: 28px;
      accent-color: #fff;
      cursor: pointer;
    }

    .option-row input[type="color"] {
      width: 28px;
      height: 28px;
      border: 1px solid #888;
      padding: 0;
      background: #fff;
      cursor: pointer;
    }

    .study-options-ok {
      width: 58px;
      height: 42px;
      border: 3px solid #111;
      background: #fff;
      color: #111;
      justify-self: end;
      margin-top: -4px;
      margin-right: -18px;
      font-size: 20px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="home-page" id="homePage">
    <h1>Chào mừng đến với trang web của TON</h1>
    <button class="flashcard-button" id="openFlashcard" type="button">Flashcard</button>
  </main>

  <main class="flashcard-page hidden" id="flashcardPage">
    <button class="home-nav-button" type="button">HOME</button>
    <section class="flashcard-frame" aria-label="Danh sách flashcard">
      <div class="flashcard-toolbar">
        <button class="icon-button back-icon" id="backHome" type="button" aria-label="Quay lại"></button>
        <button class="icon-button settings-icon" id="openListSettings" type="button" aria-label="Cài đặt">&#9881;</button>
      </div>

      <div class="deck-list" id="deckList">
        <form class="name-form hidden" id="nameForm">
          <button class="name-action" id="cancelName" type="button">Cancel</button>
          <input class="name-input" id="deckName" type="text" aria-label="Tên flashcard" autocomplete="off">
          <button class="name-action" type="submit">OK</button>
        </form>
        <button class="add-card-button" id="addCard" type="button" aria-label="Thêm flashcard">+</button>
      </div>
    </section>
  </main>

  <main class="flashcard-page hidden" id="deckPage">
    <button class="home-nav-button" type="button">HOME</button>
    <section class="flashcard-frame" aria-label="Chi tiết flashcard">
      <div class="deck-toolbar">
        <button class="icon-button back-icon" id="backDeckList" type="button" aria-label="Quay lại"></button>
        <div class="screen-title" id="deckTitle"></div>
        <button class="study-start" id="startStudy" type="button">HỌC</button>
        <button class="icon-button settings-icon" id="openDeckSettings" type="button" aria-label="Cài đặt">&#9881;</button>
      </div>

      <div class="deck-word-list" id="deckWordList"></div>
    </section>
  </main>

  <main class="flashcard-page hidden" id="studyPage">
    <button class="home-nav-button" type="button">HOME</button>
    <section class="flashcard-frame" aria-label="Học flashcard">
      <div class="flashcard-toolbar">
        <button class="icon-button back-icon" id="backStudyDeck" type="button" aria-label="Quay lại"></button>
        <div class="screen-title" id="studyTitle"></div>
        <button class="icon-button settings-icon" id="openStudyOptions" type="button" aria-label="Cài đặt">&#9881;</button>
      </div>

      <div class="study-card" id="studyCard"></div>

      <div class="study-actions">
        <button class="study-action" id="rememberStudyCard" type="button">Nhớ</button>
        <button class="study-action" id="forgotStudyCard" type="button">chưa</button>
        <button class="study-action" id="flipStudyCard" type="button">Lật</button>
        <button class="study-action" id="restartStudyCard" type="button" aria-label="Làm lại">&#8635;</button>
      </div>

      <div class="study-nav">
        <button class="study-nav-button" id="previousStudyCard" type="button" aria-label="Từ trước">‹</button>
        <button class="study-nav-button" id="nextStudyCard" type="button" aria-label="Từ tiếp theo">›</button>
        <button class="study-add-button" id="openAddToGroup" type="button">Thêm</button>
      </div>
    </section>
  </main>

  <main class="flashcard-page hidden" id="addToGroupPage">
    <button class="home-nav-button" type="button">HOME</button>
    <section class="flashcard-frame" aria-label="Thêm vào nhóm">
      <div class="flashcard-toolbar">
        <button class="icon-button back-icon" id="backStudyFromGroup" type="button" aria-label="Quay lại"></button>
        <div class="screen-title">Thêm vào nhóm</div>
      </div>

      <div class="group-list" id="groupList"></div>
      <button class="create-group-button" id="showCreateGroup" type="button">Tạo nhóm mới</button>

      <form class="group-form hidden" id="groupForm">
        <input class="group-name-input" id="groupName" type="text" placeholder="Tên nhóm" autocomplete="off">
        <button class="group-form-button" type="submit">OK</button>
        <button class="group-form-button" id="cancelGroup" type="button">Hủy</button>
      </form>
    </section>
  </main>

  <main class="flashcard-page hidden" id="studyOptionsPage">
    <button class="home-nav-button" type="button">HOME</button>
    <section class="flashcard-frame" aria-label="Tùy chọn học">
      <div class="flashcard-toolbar">
        <button class="icon-button back-icon" id="backStudyOptions" type="button" aria-label="Quay lại"></button>
        <div class="screen-title" id="studyOptionsTitle"></div>
      </div>

      <form class="study-options" id="studyOptionsForm">
        <div class="option-section-title">mặt trước</div>
        <label class="option-row">漢字 <input type="checkbox" name="front" value="kanji" checked><input type="color" data-side="front" data-field="kanji" value="#111111"></label>
        <label class="option-row">Higarana <input type="checkbox" name="front" value="higarana"><input type="color" data-side="front" data-field="higarana" value="#111111"></label>
        <label class="option-row">Hán Việt <input type="checkbox" name="front" value="hanViet"><input type="color" data-side="front" data-field="hanViet" value="#111111"></label>
        <label class="option-row">Nghĩa <input type="checkbox" name="front" value="meaning"><input type="color" data-side="front" data-field="meaning" value="#111111"></label>
        <label class="option-row">Ví dụ <input type="checkbox" name="front" value="example"><input type="color" data-side="front" data-field="example" value="#111111"></label>
        <label class="option-row">Nghĩa <input type="checkbox" name="front" value="exampleMeaning"><input type="color" data-side="front" data-field="exampleMeaning" value="#111111"></label>

        <div class="option-section-title">mặt sau</div>
        <label class="option-row">漢字 <input type="checkbox" name="back" value="kanji"><input type="color" data-side="back" data-field="kanji" value="#111111"></label>
        <label class="option-row">Higarana <input type="checkbox" name="back" value="higarana" checked><input type="color" data-side="back" data-field="higarana" value="#111111"></label>
        <label class="option-row">Hán Việt <input type="checkbox" name="back" value="hanViet" checked><input type="color" data-side="back" data-field="hanViet" value="#111111"></label>
        <label class="option-row">Nghĩa <input type="checkbox" name="back" value="meaning" checked><input type="color" data-side="back" data-field="meaning" value="#111111"></label>
        <label class="option-row">Ví dụ <input type="checkbox" name="back" value="example"><input type="color" data-side="back" data-field="example" value="#111111"></label>
        <label class="option-row">Nghĩa <input type="checkbox" name="back" value="exampleMeaning"><input type="color" data-side="back" data-field="exampleMeaning" value="#111111"></label>

        <button class="study-options-ok" type="submit">OK</button>
      </form>
    </section>
  </main>

  <main class="flashcard-page hidden" id="settingsPage">
    <button class="home-nav-button" type="button">HOME</button>
    <section class="flashcard-frame" aria-label="Cài đặt">
      <div class="flashcard-toolbar">
        <button class="icon-button back-icon" id="backDeckDetail" type="button" aria-label="Quay lại"></button>
        <div class="screen-title">Cài đặt</div>
      </div>

      <div class="settings-list">
        <button class="settings-action" id="loadDefaultData" type="button">l&#7845;y d&#7919; li&#7879;u m&#7863;c &#273;&#7883;nh</button>
        <button class="settings-action" id="openExcelUpload" type="button">Thêm bằng excel</button>
        <button class="settings-action" id="openAddWord" type="button">Thêm 1 từ</button>
        <input class="hidden" id="excelUpload" type="file" accept=".xlsx,.xls,.csv">
      </div>
    </section>
  </main>

  <main class="flashcard-page hidden" id="addWordPage">
    <button class="home-nav-button" type="button">HOME</button>
    <section class="flashcard-frame" aria-label="Thêm 1 từ">
      <div class="flashcard-toolbar">
        <button class="icon-button back-icon" id="backSettings" type="button" aria-label="Quay lại"></button>
        <div class="screen-title">Thêm 1 từ</div>
      </div>

      <form class="word-form" id="wordForm">
        <label class="word-label" for="kanji">漢字</label>
        <input class="word-input" id="kanji" type="text" autocomplete="off">

        <label class="word-label" for="higarana">Higarana</label>
        <input class="word-input" id="higarana" type="text" autocomplete="off">

        <label class="word-label" for="hanViet">Hán Việt</label>
        <input class="word-input" id="hanViet" type="text" autocomplete="off">

        <label class="word-label" for="meaning">Nghĩa</label>
        <input class="word-input" id="meaning" type="text" autocomplete="off">

        <label class="word-label" for="example">Ví dụ</label>
        <input class="word-input" id="example" type="text" autocomplete="off">

        <label class="word-label" for="exampleMeaning">Nghĩa</label>
        <input class="word-input" id="exampleMeaning" type="text" autocomplete="off">

        <button class="word-submit" type="submit">OK</button>
      </form>
    </section>
  </main>

  <script>
    const homePage = document.getElementById("homePage");
    const homeNavButtons = document.querySelectorAll(".home-nav-button");
    const flashcardPage = document.getElementById("flashcardPage");
    const deckPage = document.getElementById("deckPage");
    const studyPage = document.getElementById("studyPage");
    const addToGroupPage = document.getElementById("addToGroupPage");
    const studyOptionsPage = document.getElementById("studyOptionsPage");
    const settingsPage = document.getElementById("settingsPage");
    const addWordPage = document.getElementById("addWordPage");
    const openFlashcard = document.getElementById("openFlashcard");
    const backHome = document.getElementById("backHome");
    const backDeckList = document.getElementById("backDeckList");
    const backStudyDeck = document.getElementById("backStudyDeck");
    const backStudyFromGroup = document.getElementById("backStudyFromGroup");
    const backStudyOptions = document.getElementById("backStudyOptions");
    const backDeckDetail = document.getElementById("backDeckDetail");
    const backSettings = document.getElementById("backSettings");
    const openListSettings = document.getElementById("openListSettings");
    const openDeckSettings = document.getElementById("openDeckSettings");
    const openStudyOptions = document.getElementById("openStudyOptions");
    const loadDefaultData = document.getElementById("loadDefaultData");
    const openExcelUpload = document.getElementById("openExcelUpload");
    const excelUpload = document.getElementById("excelUpload");
    const openAddWord = document.getElementById("openAddWord");
    const wordForm = document.getElementById("wordForm");
    const studyOptionsForm = document.getElementById("studyOptionsForm");
    const deckList = document.getElementById("deckList");
    const addCard = document.getElementById("addCard");
    const startStudy = document.getElementById("startStudy");
    const studyTitle = document.getElementById("studyTitle");
    const studyOptionsTitle = document.getElementById("studyOptionsTitle");
    const studyCard = document.getElementById("studyCard");
    const rememberStudyCard = document.getElementById("rememberStudyCard");
    const forgotStudyCard = document.getElementById("forgotStudyCard");
    const flipStudyCard = document.getElementById("flipStudyCard");
    const restartStudyCard = document.getElementById("restartStudyCard");
    const previousStudyCard = document.getElementById("previousStudyCard");
    const nextStudyCard = document.getElementById("nextStudyCard");
    const openAddToGroup = document.getElementById("openAddToGroup");
    const groupList = document.getElementById("groupList");
    const showCreateGroup = document.getElementById("showCreateGroup");
    const groupForm = document.getElementById("groupForm");
    const groupName = document.getElementById("groupName");
    const cancelGroup = document.getElementById("cancelGroup");
    const nameForm = document.getElementById("nameForm");
    const deckName = document.getElementById("deckName");
    const cancelName = document.getElementById("cancelName");
    const deckTitle = document.getElementById("deckTitle");
    const deckWordList = document.getElementById("deckWordList");
    const storageKey = "tonFlashcardAppState";
    const deckNames = [];
    const groupNames = [];
    const wordsByDeck = {};

c sinh ti\u1ec3u h\u1ecdc r\u1ed3i"},{"kanji":"\u3044\u3064\u306e\u9593\u306b\u304b","hanViet":"GIAN","higarana":"\u3044\u3064\u306e\u307e\u306b\u304b","meaning":"bi\u1ebft","example":"\u3044\u3064\u306e\u9593\u306b\u304b\u3001\u5916\u306f\u6697\u304f\u306a\u3063\u3066\u3044\u305f","exampleMeaning":"Ngo\u00e0i tr\u1eddi \u0111\u00e3 tr\u1edf n\u00ean t\u1ed1i t\u1eeb l\u00fac n\u00e0o kh\u00f4ng\nbi\u1ebft"},{"kanji":"\u3057\u3070\u3089\u304f","hanViet":"","higarana":"\u3057\u3070\u3089\u304f","meaning":"m\u1ed9t ch\u00fat","example":"\u305f\u3060\u4eca\u7a93\u53e3\u304c\u8fbc\u3093\u3067\u3044\u307e\u3059\u306e\u3067\u3001\u3082\u3046\u3057\u3070\u3089\u304f\n\u304a\u5f85\u3061\u304f\u3060\u3055\u3044","exampleMeaning":"V\u00ec c\u1eeda b\u00e1n v\u00e9 \u0111ang r\u1ea5t \u0111\u00f4ng n\u00ean xin h\u00e3y\nch\u1edd m\u1ed9t ch\u00fat"},{"kanji":"\u305a\u3063\u3068","hanViet":"","higarana":"\u305a\u3063\u3068","meaning":"su\u1ed1t, nhi\u1ec1u","example":"\u30d0\u30b9\u3088\u308a\u3082\u5730\u4e0b\u9244\u3067\u884c\u304f\u307b\u3046\u304c\u305a\u3063\u3068\u901f\u3044","exampleMeaning":"So v\u1edbi xe bu\u00fdt th\u00ec \u0111i b\u1eb1ng t\u00e0u \u0111i\u1ec7n ng\u1ea7m\nnhanh h\u01a1n h\u1eb3n"},{"kanji":"\u76f8\u5909\u308f\u3089\u305a","hanViet":"T\u01af\u01a0NG BI\u1ebeN","higarana":"\u3042\u3044\u304b\u308f\u3089\u305a","meaning":"nh\u01b0 m\u1ecdi khi","example":"\u3042\u306e\u5973\u512a\u306f\u5e74\u3092\u53d6\u3063\u305f\u4eca\u3082\u76f8\u5909\u308f\u3089\u305a\u304d\u308c\u3044\u3060","exampleMeaning":"N\u1eef di\u1ec5n vi\u00ean kia d\u00f9 b\u00e2y gi\u1edd \u0111\u00e3 c\u00f3 tu\u1ed5i\nnh\u01b0ng v\u1eabn \u0111\u1eb9p nh\u01b0 ng\u00e0y n\u00e0o"},{"kanji":"\u6b21\u3005\u306b","hanViet":"TH\u1ee8","higarana":"\u3064\u304e\u3064\u304e\u306b","meaning":"l\u1ea7n l\u01b0\u1ee3t","example":"\u65b0\u3057\u3044\u30bf\u30a4\u30d7\u306e\u30a4\u30f3\u30b9\u30bf\u30f3\u30c8\u98df\u54c1\u304c\u6b21\u3005\u306b\u767a\u58f2\n\u3055\u308c\u3066\u3044\u308b","exampleMeaning":"C\u00e1c lo\u1ea1i \u0111\u1ed3 \u0103n nhanh m\u1edbi l\u1ea7n l\u01b0\u1ee3t \u0111\u01b0\u1ee3c b\u00e1n\nra"},{"kanji":"\u3069\u3093\u3069\u3093","hanViet":"","higarana":"\u3069\u3093\u3069\u3093","meaning":"d\u1ea7n d\u1ea7n","example":"\u4eca\u65e5\u306f\u4f53\u8abf\u3082\u3088\u304f\u3001\u4ed5\u4e8b\u304c\u3069\u3093\u3069\u3093\u9032\u3093\u3060","exampleMeaning":"H\u00f4m nay th\u1ec3 tr\u1ea1ng c\u0169ng t\u1ed1t, c\u00f4ng vi\u1ec7c th\u00ec\nd\u1ea7n ti\u1ebfn tri\u1ec3n"},{"kanji":"\u307e\u3059\u307e\u3059","hanViet":"","higarana":"\u307e\u3059\u307e\u3059","meaning":"c\u00e0ng ng\u00e0y c\u00e0ng","example":"\u671d\u304b\u3089\u964d\u3063\u3066\u3044\u305f\u96e8\u306f\u5348\u5f8c\u306b\u306a\u308b\u3068\u307e\u3059\u307e\u3059\u5f37\n\u304f\u306a\u3063\u305f","exampleMeaning":"M\u01b0a t\u1eeb s\u00e1ng, sang bu\u1ed5i chi\u1ec1u th\u00ec \u0111\u00e3 c\u00e0ng\ntr\u1edf n\u00ean m\u1ea1nh h\u01a1n"},{"kanji":"\u3084\u3063\u3068","hanViet":"","higarana":"\u3084\u3063\u3068","meaning":"cu\u1ed1i c\u00f9ng, v\u1eeba \u0111\u1ee7","example":"\uff13\uff10\u5206\u3082\u5f85\u3063\u3066\u3001\u3084\u3063\u3068\u30d0\u30b9\u304c\u6765\u305f","exampleMeaning":"Ch\u1edd \u0111\u1ebfn t\u1eadn 30 ph\u00fat, cu\u1ed1i c\u00f9ng xe bus \u0111\u00e3\nt\u1edbi"},{"kanji":"\u3068\u3046\u3068\u3046","hanViet":"","higarana":"\u3068\u3046\u3068\u3046","meaning":"c\u00f9ng, sau t\u1ea5t c\u1ea3","example":"\u9577\u3044\u9593\u4f7f\u3063\u3066\u3044\u305f\u6d17\u6fef\u6a5f\u304c\u3068\u3046\u3068\u3046\u58ca\u308c\u3066\u3057\u307e\n\u3063\u305f","exampleMeaning":"Chi\u1ebfc m\u00e1i gi\u1eb7t \u0111\u00e3 d\u00f9ng th\u1eddi gian d\u00e0i sau\nc\u00f9ng \u0111\u00e3 h\u1ecfng m\u1ea5t r\u1ed3i"},{"kanji":"\u3064\u3044\u306b","hanViet":"","higarana":"\u3064\u3044\u306b","meaning":"c\u00f9ng","example":"\u82e5\u3044\u3053\u308d\u306e\u5922\u3092\u3064\u3044\u306b\u5b9f\u73fe\u3059\u308b\u3053\u3068\u304c\u51fa\u6765\u305f","exampleMeaning":"Gi\u1ea5c m\u01a1     const displaySettings = {
      front: ["kanji"],

      colors: {

        back: {}
      }
    };
    let currentDeckName = "";
    let currentStudyIndex = 0;

    let isRandomMode = false;
    let isStudyCardBack = false;
    let editingWordIndex = null;
    let editingDeckName = null;

    function showScreen(screen) {
      previousScreen = activeScreen;
      activeScreen = screen;
      homePage.classList.add("hidden");
      flashcardPage.classList.add("hidden");
      deckPage.classList.add("hidden");
      studyPage.classList.add("hidden");
      addToGroupPage.classList.add("hidden");
      studyOptionsPage.classList.add("hidden");
      settingsPage.classList.add("hidden");
      addWordPage.classList.add("hidden");
      screen.classList.remove("hidden");
    }

    function getCurrentWords() {
      return wordsByDeck[currentDeckName] || [];
    }

    function ensureMemoryGroups() {
      const memoryGroupNames = [rememberedGroupName, forgottenGroupName];

      memoryGroupNames.forEach((groupNameValue) => {
        if (!deckNames.includes(groupNameValue)) {
          deckNames.push(groupNameValue);
        }

        if (!groupNames.includes(groupNameValue)) {
          groupNames.push(groupNameValue);
        }

        if (!wordsByDeck[groupNameValue]) {
          wordsByDeck[groupNameValue] = [];
        }

        if (!wordsByGroup[groupNameValue]) {
          wordsByGroup[groupNameValue] = wordsByDeck[groupNameValue];
        }
      });

      const regularDeckNames = deckNames.filter((name) => !memoryGroupNames.includes(name));
      deckNames.splice(0, deckNames.length, ...memoryGroupNames, ...regularDeckNames);

      const regularGroupNames = groupNames.filter((name) => !memoryGroupNames.includes(name));
      groupNames.splice(0, groupNames.length, ...memoryGroupNames, ...regularGroupNames);
    }

    function isMemoryGroup(deckNameValue) {
      return deckNameValue === rememberedGroupName || deckNameValue === forgottenGroupName;
    }

    function getWordKey(word, fallbackDeckName = currentDeckName) {
      return [
        word.sourceDeck || fallbackDeckName,
        word.kanji || "",
        word.higarana || "",
        word.hanViet || "",
        word.meaning || "",
        word.example || "",
        word.exampleMeaning || ""
      ].join("|");
    }

    function removeWordFromMemoryGroups(word) {
      const targetKey = getWordKey(word);

      [rememberedGroupName, forgottenGroupName].forEach((groupNameValue) => {
        const groupWords = wordsByDeck[groupNameValue] || [];
        wordsByDeck[groupNameValue] = groupWords.filter((groupWord) => getWordKey(groupWord) !== targetKey);
        wordsByGroup[groupNameValue] = wordsByDeck[groupNameValue];
      });
    }

    function syncSourceWordStatus(word, status) {
      const sourceDeckName = word.sourceDeck;
      if (!sourceDeckName || !wordsByDeck[sourceDeckName]) {
        return;
      }

      const targetKey = getWordKey(word);
      const sourceWord = wordsByDeck[sourceDeckName].find((item) => getWordKey(item, sourceDeckName) === targetKey);
      if (sourceWord) {
        sourceWord.memoryStatus = status;
      }
    }

    function markCurrentStudyWord(status) {
      const word = getCurrentStudyWord();
      if (!word) {
        return;
      }

      ensureMemoryGroups();
      const targetGroupName = status === "remembered" ? rememberedGroupName : forgottenGroupName;
      const isStudyingMemoryGroup = isMemoryGroup(currentDeckName);
      word.memoryStatus = status;
      syncSourceWordStatus(word, status);
      removeWordFromMemoryGroups(word);

      wordsByDeck[targetGroupName].push({
        ...word,
        sourceDeck: word.sourceDeck || currentDeckName,
        memoryStatus: status
      });
      wordsByGroup[targetGroupName] = wordsByDeck[targetGroupName];

      saveAppState();
      renderDeckList();

      if (isStudyingMemoryGroup) {
        createStudyOrder();

        if (studyOrder.length === 0) {
          renderDeckWords();
          showScreen(deckPage);
          return;
        }

        if (currentStudyIndex >= studyOrder.length) {
          currentStudyIndex = Math.max(studyOrder.length - 1, 0);
        }

        isStudyCardBack = false;
      }

      renderStudyCard();
    }

    function saveAppState() {
      const appState = {
        deckNames,
        groupNames,
        wordsByDeck,
        wordsByGroup,
        displaySettings
      };

      localStorage.setItem(storageKey, JSON.stringify(appState));
    }

    function getSafeExcelFileName(name) {
      return name.replace(/[\\/:*?"<>|]/g, "_").trim() || "flashcard";
    }

    function exportDeckToExcel(name) {
      if (typeof XLSX === "undefined") {
        alert("Khong tai duoc thu vien Excel. Vui long kiem tra ket noi mang roi thu lai.");
        return;
      }

      const rows = [
        ["Stt", "\u6f22\u5b57", "H\u00e1n Vi\u1ec7t", "Hiragana", "Ngh\u0129a", "v\u00ed d\u1ee5", "ngh\u0129a"],
        ...(wordsByDeck[name] || []).map((word, index) => [
          index + 1,
          word.kanji || "",
          word.hanViet || "",
          word.higarana || "",
          word.meaning || "",
          word.example || "",
          word.exampleMeaning || ""
        ])
      ];
      const worksheet = XLSX.utils.aoa_to_sheet(rows);
      worksheet["!cols"] = [
        { wch: 8 },
        { wch: 18 },
        { wch: 22 },
        { wch: 20 },
        { wch: 24 },
        { wch: 24 },
        { wch: 24 }
      ];

      const range = XLSX.utils.decode_range(worksheet["!ref"]);
      for (let rowIndex = range.s.r; rowIndex <= range.e.r; rowIndex += 1) {
        for (let columnIndex = range.s.c; columnIndex <= range.e.c; columnIndex += 1) {
          const cellAddress = XLSX.utils.encode_cell({ r: rowIndex, c: columnIndex });
          const cell = worksheet[cellAddress];
          if (!cell) {
            continue;
          }

          cell.s = {
            alignment: {
              horizontal: "center",
              vertical: "center",
              wrapText: true
            }
          };
        }
      }

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Flashcard");
      XLSX.writeFile(workbook, `${getSafeExcelFileName(name)}.xlsx`);
    }

    function createDeckRow(name) {
      const deckRow = document.createElement("div");
      deckRow.className = "deck-row";

      const deckOpen = document.createElement("button");
      deckOpen.className = "deck-open";
      deckOpen.type = "button";
      deckOpen.textContent = name;
      deckOpen.addEventListener("click", () => {
        currentDeckName = name;
        deckTitle.textContent = name;
        renderDeckWords();
        showScreen(deckPage);
      });

      const deckMenu = document.createElement("button");
      deckMenu.className = "deck-menu";
      deckMenu.type = "button";
      deckMenu.textContent = "...";
      deckMenu.setAttribute("aria-label", `Tùy chọn ${name}`);
      deckMenu.addEventListener("click", (event) => {
        event.stopPropagation();

        if (openWordActionMenu) {
          openWordActionMenu.remove();
          openWordActionMenu = null;
        }

        const actionMenu = document.createElement("div");
        actionMenu.className = "word-action-menu";

        const renameButton = document.createElement("button");
        renameButton.className = "word-action-button";
        renameButton.type = "button";
        renameButton.textContent = "Chỉnh tên";
        renameButton.addEventListener("click", () => {
          actionMenu.remove();
          openWordActionMenu = null;
          editingDeckName = name;
          deckName.value = name;
          addCard.classList.add("hidden");
          nameForm.classList.remove("hidden");
          deckName.focus();
        });

        const exportButton = document.createElement("button");
        exportButton.className = "word-action-button";
        exportButton.type = "button";
        exportButton.textContent = "Xu\u1ea5t Excel";
        exportButton.addEventListener("click", () => {
          actionMenu.remove();
          openWordActionMenu = null;
          exportDeckToExcel(name);
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "word-action-button";
        deleteButton.type = "button";
        deleteButton.textContent = "Xóa";
        deleteButton.addEventListener("click", () => {
          const shouldDelete = confirm(`Xóa "${name}"?`);
          if (shouldDelete) {
            const deckIndex = deckNames.indexOf(name);
            if (deckIndex >= 0) {
              deckNames.splice(deckIndex, 1);
            }

            const groupIndex = groupNames.indexOf(name);
            if (groupIndex >= 0) {
              groupNames.splice(groupIndex, 1);
            }

            deckRow.remove();
            delete wordsByDeck[name];
            delete wordsByGroup[name];
            saveAppState();
          }
        });

        actionMenu.append(renameButton, exportButton, deleteButton);
        deckRow.append(actionMenu);
        openWordActionMenu = actionMenu;
      });

      deckRow.append(deckOpen, deckMenu);
      return deckRow;
    }

    function renderDeckList() {
      deckList.querySelectorAll(".deck-row").forEach((row) => row.remove());

      deckNames.forEach((name) => {
        deckList.insertBefore(createDeckRow(name), nameForm);
      });
    }

    function loadAppState() {
      const savedState = localStorage.getItem(storageKey);
      if (!savedState) {
        migrateDefaultDeckNames();
        ensureMemoryGroups();
        renderDeckList();
        saveAppState();
        return;
      }

      try {
        const appState = JSON.parse(savedState);

        if (Array.isArray(appState.deckNames)) {
          deckNames.splice(0, deckNames.length, ...appState.deckNames);
        }

        if (appState.wordsByDeck && typeof appState.wordsByDeck === "object") {
          Object.assign(wordsByDeck, appState.wordsByDeck);
        }

        if (Array.isArray(appState.groupNames)) {
          groupNames.splice(0, groupNames.length, ...appState.groupNames);
        }

        if (appState.wordsByGroup && typeof appState.wordsByGroup === "object") {
          Object.assign(wordsByGroup, appState.wordsByGroup);
        }

        groupNames.forEach((name) => {
          if (!deckNames.includes(name)) {
            deckNames.push(name);
            wordsByDeck[name] = wordsByGroup[name] || [];
          }
        });

        if (appState.displaySettings && typeof appState.displaySettings === "object") {
          if (Array.isArray(appState.displaySettings.front)) {
            displaySettings.front = appState.displaySettings.front;
          }

          if (Array.isArray(appState.displaySettings.back)) {
            displaySettings.back = appState.displaySettings.back;
          }

          if (appState.displaySettings.colors && typeof appState.displaySettings.colors === "object") {
            displaySettings.colors.front = appState.displaySettings.colors.front || {};
            displaySettings.colors.back = appState.displaySettings.colors.back || {};
          }
        }

        migrateDefaultDeckNames();
        ensureMemoryGroups();
        renderDeckList();
      } catch (error) {
        localStorage.removeItem(storageKey);
      }
    }

    function openEditWord(index) {
      const word = getCurrentWords()[index];
      if (!word) {
        return;
      }

      editingWordIndex = index;
      document.getElementById("kanji").value = word.kanji || "";
      document.getElementById("higarana").value = word.higarana || "";
      document.getElementById("hanViet").value = word.hanViet || "";
      document.getElementById("meaning").value = word.meaning || "";
      document.getElementById("example").value = word.example || "";
      document.getElementById("exampleMeaning").value = word.exampleMeaning || "";
      showScreen(addWordPage);
    }

    function renderStudyCard() {
      const word = getCurrentWords()[studyOrder[currentStudyIndex]];
      studyCard.innerHTML = "";
      rememberStudyCard.classList.remove("remembered-active");
      forgotStudyCard.classList.remove("forgotten-active");

      if (!word) {
        return;
      }

      const memoryDot = document.createElement("span");
      memoryDot.className = "memory-dot";
      memoryDot.setAttribute("aria-hidden", "true");

      const cardNumber = document.createElement("span");
      cardNumber.className = "study-card-number";
      cardNumber.textContent = studyOrder[currentStudyIndex] + 1;

      if (word.memoryStatus === "remembered") {
        memoryDot.classList.add("remembered");
        rememberStudyCard.classList.add("remembered-active");
      }

      if (word.memoryStatus === "forgotten") {
        memoryDot.classList.add("forgotten");
        forgotStudyCard.classList.add("forgotten-active");
      }

      const side = isStudyCardBack ? "back" : "front";
      const selectedFields = displaySettings[side];
      const values = selectedFields
        .map((field) => ({
          field,
          value: word[field]
        }))
        .filter((item) => item.value && item.value.trim());

      const content = document.createElement("div");
      content.className = `study-card-content${values.length > 1 ? " multi" : ""}`;

      (values.length ? values : [{ field: "", value: "" }]).forEach((item) => {
        const line = document.createElement("div");
        line.textContent = item.value;
        line.style.color = displaySettings.colors[side][item.field] || "#111111";
        content.append(line);
      });

      studyCard.append(memoryDot, cardNumber, content);
    }

    function createStudyOrder() {
      studyOrder = getCurrentWords().map((word, index) => index);
    }

    function shuffleStudyOrder() {
      for (let index = studyOrder.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [studyOrder[index], studyOrder[randomIndex]] = [studyOrder[randomIndex], studyOrder[index]];
      }
    }

    function getCurrentStudyWord() {
      const targetIndex = wordIndexToAddToGroup ?? studyOrder[currentStudyIndex];
      return getCurrentWords()[targetIndex] || null;
    }

    function addCurrentWordToGroup(groupNameValue) {
      const word = getCurrentStudyWord();
      if (!word) {
        return;
      }

      if (!wordsByDeck[groupNameValue]) {
        wordsByDeck[groupNameValue] = [];
      }

      wordsByDeck[groupNameValue].push({
        ...word,
        sourceDeck: currentDeckName
      });
      saveAppState();
      alert(`Đã thêm vào nhóm "${groupNameValue}".`);
      wordIndexToAddToGroup = null;
      showScreen(addToGroupReturnScreen);
    }

    function renderGroupList() {
      groupList.innerHTML = "";

      deckNames.forEach((name) => {
        const groupButton = document.createElement("button");
        groupButton.className = "group-button";
        groupButton.type = "button";
        groupButton.textContent = name;
        groupButton.addEventListener("click", () => {
          addCurrentWordToGroup(name);
        });

        groupList.append(groupButton);
      });
    }

    function openStudyScreen() {
      studyTitle.textContent = `HỌC: ${currentDeckName}`;
      createStudyOrder();
      if (isRandomMode) {
        shuffleStudyOrder();
      }
      currentStudyIndex = 0;
      isStudyCardBack = false;
      restartStudyCard.classList.toggle("active", isRandomMode);
      renderStudyCard();
      showScreen(studyPage);
    }

    function addWordsToCurrentDeck(words) {
      if (!currentDeckName || words.length === 0) {
        return;
      }

      if (!wordsByDeck[currentDeckName]) {
        wordsByDeck[currentDeckName] = [];
      }

      wordsByDeck[currentDeckName].push(...words);
      saveAppState();
      renderDeckWords();
      showScreen(deckPage);
    }

    function readExcelSheetRows(sheet) {
      const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: ""
      });

      return rows.slice(1).map((row) => ({
        kanji: String(row[1] || "").trim(),
        hanViet: String(row[2] || "").trim(),
        higarana: String(row[3] || "").trim(),
        meaning: String(row[4] || "").trim(),
        example: String(row[5] || "").trim(),
        exampleMeaning: String(row[6] || "").trim()
      })).filter((word) => (
        word.kanji ||
        word.hanViet ||
        word.higarana ||
        word.meaning ||
        word.example ||
        word.exampleMeaning
      ));
    }

    function readExcelRows(workbook) {
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      return readExcelSheetRows(sheet);
    }

    function getExcelDeckName(defaultFile, sheetName, sheetCount) {
      if (sheetCount > 1 && sheetName && !/^sheet\d*$/i.test(sheetName)) {
        return sheetName;
      }

      const fileName = decodeURIComponent(defaultFile.url.split("/").pop() || defaultFile.url);
      return defaultFile.deckName || fileName.replace(/\.[^/.]+$/, "");
    }

    function migrateDefaultDeckNames() {
      Object.entries(defaultDeckNameAliases).forEach(([oldName, newName]) => {
        if (!deckNames.includes(oldName) || deckNames.includes(newName)) {
          return;
        }

        const deckIndex = deckNames.indexOf(oldName);
        if (deckIndex >= 0) {
          deckNames[deckIndex] = newName;
        }

        const groupIndex = groupNames.indexOf(oldName);
        if (groupIndex >= 0) {
          groupNames[groupIndex] = newName;
        }

        wordsByDeck[newName] = wordsByDeck[oldName] || [];
        delete wordsByDeck[oldName];

        if (wordsByGroup[oldName]) {
          wordsByGroup[newName] = wordsByGroup[oldName];
          delete wordsByGroup[oldName];
        }
      });
    }

    function loadEmbeddedDefaultDecks() {
      let loadedAnyDeck = false;

      embeddedDefaultDecks.forEach((defaultDeck) => {
        const deckNameValue = getExcelDeckName(defaultDeck, "", 1);

        if (!deckNames.includes(deckNameValue)) {
          deckNames.push(deckNameValue);
        }

        wordsByDeck[deckNameValue] = defaultDeck.words.map((word) => ({ ...word }));
        loadedAnyDeck = true;
      });

      if (loadedAnyDeck) {
        ensureMemoryGroups();
        saveAppState();
      }

      return loadedAnyDeck;
    }

    async function loadDefaultExcelDecks() {
      if (typeof XLSX === "undefined" || typeof fetch === "undefined") {
        return false;
      }

      let loadedAnyDeck = false;

      for (const defaultFile of defaultExcelFiles) {
        try {
          const response = await fetch(encodeURI(defaultFile.url));
          if (!response.ok) {
            continue;
          }

          const data = await response.arrayBuffer();
          const workbook = XLSX.read(data, { type: "array" });

          workbook.SheetNames.forEach((sheetName) => {
            const sheet = workbook.Sheets[sheetName];
            const words = readExcelSheetRows(sheet);
            if (words.length === 0) {
              return;
            }

            const deckNameValue = getExcelDeckName(defaultFile, sheetName, workbook.SheetNames.length);
            if (deckNames.includes(deckNameValue)) {
              return;
            }

            deckNames.push(deckNameValue);
            wordsByDeck[deckNameValue] = words;
            loadedAnyDeck = true;
          });
        } catch (error) {
          console.warn(`Khong tai duoc file mac dinh: ${defaultFile.url}`, error);
        }
      }

      if (loadedAnyDeck) {
        ensureMemoryGroups();
        saveAppState();
        renderDeckList();
      }

      return loadedAnyDeck;
    }

    function syncStudyOptionInputs() {
      studyOptionsTitle.textContent = `HỌC: ${currentDeckName}`;

      studyOptionsForm.querySelectorAll("input[type='checkbox']").forEach((checkbox) => {
        checkbox.checked = displaySettings[checkbox.name].includes(checkbox.value);
      });

      studyOptionsForm.querySelectorAll("input[type='color']").forEach((colorInput) => {
        const side = colorInput.dataset.side;
        const field = colorInput.dataset.field;
        colorInput.value = displaySettings.colors[side][field] || "#111111";
      });
    }

    openFlashcard.addEventListener("click", () => {
      showScreen(flashcardPage);
    });

    homeNavButtons.forEach((homeNavButton) => {
      homeNavButton.addEventListener("click", () => {
        showScreen(homePage);
      });
    });

    document.addEventListener("click", () => {
      if (openWordActionMenu) {
        openWordActionMenu.remove();
        openWordActionMenu = null;
      }
    });

    backHome.addEventListener("click", () => {
      showScreen(homePage);
    });

    backDeckList.addEventListener("click", () => {
      showScreen(flashcardPage);
    });

    backDeckDetail.addEventListener("click", () => {
      showScreen(settingsReturnScreen);
    });

    backStudyDeck.addEventListener("click", () => {
      showScreen(deckPage);
    });

    backStudyFromGroup.addEventListener("click", () => {
      wordIndexToAddToGroup = null;
      groupForm.classList.add("hidden");
      showCreateGroup.classList.remove("hidden");
      showScreen(addToGroupReturnScreen);
    });

    backStudyOptions.addEventListener("click", () => {
      showScreen(studyPage);
    });

    backSettings.addEventListener("click", () => {
      editingWordIndex = null;
      wordForm.reset();
      showScreen(settingsPage);
    });

    openListSettings.addEventListener("click", () => {
      settingsReturnScreen = flashcardPage;
      showScreen(settingsPage);
    });

    openDeckSettings.addEventListener("click", () => {
      settingsReturnScreen = deckPage;
      showScreen(settingsPage);
    });

    openStudyOptions.addEventListener("click", () => {
      syncStudyOptionInputs();
      showScreen(studyOptionsPage);
    });

    loadDefaultData.addEventListener("click", async () => {
      const loadedFromEmbedded = loadEmbeddedDefaultDecks();
      const loadedFromExcel = await loadDefaultExcelDecks();
      renderDeckList();

      if (loadedFromEmbedded || loadedFromExcel) {
        alert("Da lay du lieu mac dinh.");
        return;
      }

      alert("Du lieu mac dinh da co san hoac khong tai duoc file Excel.");
    });

    openExcelUpload.addEventListener("click", () => {
      excelUpload.click();
    });

    excelUpload.addEventListener("change", async () => {
      const file = excelUpload.files[0];
      if (!file) {
        return;
      }

      if (typeof XLSX === "undefined") {
        alert("Không tải được thư viện đọc Excel. Hãy kiểm tra kết nối mạng rồi thử lại.");
        excelUpload.value = "";
        return;
      }

      try {
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: "array" });
        const words = readExcelRows(workbook);
        addWordsToCurrentDeck(words);
      } catch (error) {
        alert("Không đọc được file Excel. Vui lòng kiểm tra lại định dạng file.");
      } finally {
        excelUpload.value = "";
      }
    });

    openAddWord.addEventListener("click", () => {
      openAddWordForm();
    });

    startStudy.addEventListener("click", () => {
      openStudyScreen();
    });

    rememberStudyCard.addEventListener("click", () => {
      markCurrentStudyWord("remembered");
    });

    forgotStudyCard.addEventListener("click", () => {
      markCurrentStudyWord("forgotten");
    });

    flipStudyCard.addEventListener("click", () => {
      isStudyCardBack = !isStudyCardBack;
      renderStudyCard();
    });

    studyCard.addEventListener("click", () => {
      isStudyCardBack = !isStudyCardBack;
      renderStudyCard();
    });

    restartStudyCard.addEventListener("click", () => {
      isRandomMode = !isRandomMode;
      restartStudyCard.classList.toggle("active", isRandomMode);
      createStudyOrder();
      if (isRandomMode) {
        shuffleStudyOrder();
      }

      currentStudyIndex = 0;
      isStudyCardBack = false;
      renderStudyCard();
    });

    previousStudyCard.addEventListener("click", () => {
      if (studyOrder.length === 0) {
        return;
      }

      currentStudyIndex = (currentStudyIndex - 1 + studyOrder.length) % studyOrder.length;
      isStudyCardBack = false;
      renderStudyCard();
    });

    nextStudyCard.addEventListener("click", () => {
      if (studyOrder.length === 0) {
        return;
      }

      currentStudyIndex = (currentStudyIndex + 1) % studyOrder.length;
      isStudyCardBack = false;
      renderStudyCard();
    });

    openAddToGroup.addEventListener("click", () => {
      wordIndexToAddToGroup = studyOrder[currentStudyIndex];
      addToGroupReturnScreen = studyPage;
      renderGroupList();
      groupForm.classList.add("hidden");
      showCreateGroup.classList.remove("hidden");
      showScreen(addToGroupPage);
    });

    showCreateGroup.addEventListener("click", () => {
      showCreateGroup.classList.add("hidden");
      groupForm.classList.remove("hidden");
      groupName.value = "";
      groupName.focus();
    });

    cancelGroup.addEventListener("click", () => {
      groupForm.classList.add("hidden");
      showCreateGroup.classList.remove("hidden");
    });

    groupForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = groupName.value.trim();
      if (!name) {
        groupName.focus();
        return;
      }

      if (!deckNames.includes(name)) {
        deckNames.push(name);
        wordsByDeck[name] = [];
      }

      saveAppState();
      renderDeckList();
      renderGroupList();
      groupForm.classList.add("hidden");
      showCreateGroup.classList.remove("hidden");
      addCurrentWordToGroup(name);
    });

    addCard.addEventListener("click", () => {
      editingDeckName = null;
      addCard.classList.add("hidden");
      nameForm.classList.remove("hidden");
      deckName.value = "";
      deckName.focus();
    });

    cancelName.addEventListener("click", () => {
      editingDeckName = null;
      deckName.value = "";
      nameForm.classList.add("hidden");
      addCard.classList.remove("hidden");
    });

    nameForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = deckName.value.trim();
      if (!name) {
        deckName.focus();
        return;
      }

      if (editingDeckName) {
        if (name !== editingDeckName && deckNames.includes(name)) {
          alert("Tên này đã tồn tại.");
          deckName.focus();
          return;
        }

        const deckIndex = deckNames.indexOf(editingDeckName);
        if (deckIndex >= 0) {
          deckNames[deckIndex] = name;
        }

        if (name !== editingDeckName) {
          wordsByDeck[name] = wordsByDeck[editingDeckName] || [];
          delete wordsByDeck[editingDeckName];

          if (wordsByGroup[editingDeckName]) {
            wordsByGroup[name] = wordsByGroup[editingDeckName];
            delete wordsByGroup[editingDeckName];
          }
        }

        const groupIndex = groupNames.indexOf(editingDeckName);
        if (groupIndex >= 0) {
          groupNames[groupIndex] = name;
        }

        if (currentDeckName === editingDeckName) {
          currentDeckName = name;
          deckTitle.textContent = name;
        }

        editingDeckName = null;
        saveAppState();
        renderDeckList();
        nameForm.classList.add("hidden");
        addCard.classList.remove("hidden");
        deckName.value = "";
        return;
      }

      if (deckNames.includes(name)) {
        alert("Tên này đã tồn tại.");
        deckName.focus();
        return;
      }

      deckNames.push(name);
      wordsByDeck[name] = [];
      deckList.insertBefore(createDeckRow(name), nameForm);
      saveAppState();
      nameForm.classList.add("hidden");
      addCard.classList.remove("hidden");
      deckName.value = "";
    });

    wordForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const existingWord = editingWordIndex === null ? null : wordsByDeck[currentDeckName][editingWordIndex];
      const word = {
        kanji: document.getElementById("kanji").value.trim(),
        higarana: document.getElementById("higarana").value.trim(),
        hanViet: document.getElementById("hanViet").value.trim(),
        meaning: document.getElementById("meaning").value.trim(),
        example: document.getElementById("example").value.trim(),
        exampleMeaning: document.getElementById("exampleMeaning").value.trim(),
        memoryStatus: existingWord ? existingWord.memoryStatus : undefined,
        sourceDeck: existingWord ? existingWord.sourceDeck : undefined
      };

      if (!currentDeckName) {
        return;
      }

      if (!wordsByDeck[currentDeckName]) {
        wordsByDeck[currentDeckName] = [];
      }

      if (editingWordIndex === null) {
        wordsByDeck[currentDeckName].push(word);
      } else {
        wordsByDeck[currentDeckName][editingWordIndex] = word;
        editingWordIndex = null;
      }

      wordForm.reset();
      saveAppState();
      renderDeckWords();
      showScreen(deckPage);
    });

    studyOptionsForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const front = Array.from(studyOptionsForm.querySelectorAll("input[name='front']:checked"))
        .map((input) => input.value);
      const back = Array.from(studyOptionsForm.querySelectorAll("input[name='back']:checked"))
        .map((input) => input.value);

      displaySettings.front = front.length ? front : ["kanji"];
      displaySettings.back = back.length ? back : ["meaning"];

      studyOptionsForm.querySelectorAll("input[type='color']").forEach((colorInput) => {
        const side = colorInput.dataset.side;
        const field = colorInput.dataset.field;
        displaySettings.colors[side][field] = colorInput.value;
      });

      saveAppState();
      renderStudyCard();
      showScreen(studyPage);
    });

    loadAppState();
  </script>
</body>
</html>
